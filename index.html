
<!DOCTYPE html>
<html>
<head>
    <title>GCD Calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: lightblue;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 80%;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>GCD Calculator</h2>

        <input type="number" id="num1" placeholder="Enter first number">

        <input type="number" id="num2" placeholder="Enter second number">

        <button onclick="calculateGCD()">Calculate GCD</button>

        <p id="result"></p>
    </div>

    <script>
        function calculateGCD() {
            let a = Math.abs(parseInt(document.getElementById("num1").value));
            let b = Math.abs(parseInt(document.getElementById("num2").value));

            if (isNaN(a) || isNaN(b)) {
                document.getElementById("result").innerHTML =
                    "Please enter both numbers";
                return;
            }

            while (b != 0) {
                let temp = b;
                b = a % b;
                a = temp;
            }

            document.getElementById("result").innerHTML =
                "GCD is: " + a;
        }
    </script>

</body>
</html>
